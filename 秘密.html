<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>良子给赵明的表白</title>
<style>
body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e7, #ffafcc);
    font-family: "PingFang SC", sans-serif;
    overflow: hidden;
}

/* 主卡片 */
.card {
    background: white;
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    transition: all 0.5s ease;
}

h1 { color: #e84393; margin-bottom: 30px; }

button {
    padding: 14px 36px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
}

.yes { background: #ff4d6d; color: white; }
.no  { background: #ddd; color: #333; }

/* 自定义弹窗 */
.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.popup-content {
    background: white;
    padding: 40px;
    border-radius: 20px;
    font-size: 22px;
    color: #e84393;
    text-align: center;
    line-height: 1.8;
    max-width: 80%;
    animation: pop 0.3s ease;
}

@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<div class="card" id="card">
    <h1>
        赵明 💗<br><br>
        我是良子<br>
        我喜欢你很久了<br><br>
        你愿意做我男朋友吗？
    </h1>
    <button class="yes" onclick="showPopup('yes')">我愿意 💖</button>
    <button class="no" onclick="showPopup('no')">再想想 💔</button>
</div>

<!-- 弹窗 -->
<div class="popup" id="popup" onclick="closePopup()">
    <div class="popup-content" id="popupText"></div>
</div>

<script>
function showPopup(type) {
    const popup = document.getElementById('popup');
    const text = document.getElementById('popupText');

    if (type === 'yes') {
        text.innerHTML = "良子开心地抱住赵明 😘<br><br>" +
                         "从今天起，你就是我的啦！<br>" +
                         "不准反悔，一辈子都不许跑！";
    } else {
        text.innerHTML = "良子当场叉腰生气 😠<br><br>" +
                         "赵明！你再好好想一想！<br>" +
                         "除了我，还有谁这么宠你？！";
    }

    popup.style.display = 'flex';
}

function closePopup() {
    document.getElementById('popup').style.display = 'none';
}
</script>

</body>
</html>
