<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>逃离继权的求爱 💒🏃♂️</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;}

/* ---- 1️⃣ 开场页：婚礼渐变背景（替换失效外网图） ---- */
#startScreen{
    position:fixed;inset:0;z-index:100;
    background: linear-gradient(rgba(80, 20, 40, 0.7), rgba(30, 10, 50, 0.7)),
                linear-gradient(135deg, #ff758f 0%, #ff7eb3 100%);
    display:flex;justify-content:center;align-items:center;flex-direction:column;
    transition:opacity 0.6s;
}
#startScreen h1{
    color:white;
    font-size: clamp(28px, 8vw, 52px);
    text-shadow: 0 0 20px #ff4d6d;
    text-align:center;
    margin-bottom:40px;
}
#startBtn{
    padding: 20px 70px;
    font-size: 26px;
    border:none;
    border-radius: 50px;
    background: linear-gradient(45deg, #ff4d6d, #ff8e8e);
    color:white;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(255,77,109,0.5);
    transition:transform 0.1s;
}
#startBtn:active{transform:scale(0.95);}

/* ---- 2️⃣ 游戏页：樱花风格渐变背景（替换失效外网图） ---- */
#gameScreen{display:none;position:fixed;inset:0;}
#gameBg{
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, #fadadd 0%, #e8c8e8 50%, #d4b4e8 100%);
    z-index:0;
    filter:brightness(0.85);
}
canvas{display:block;position:absolute;inset:0;z-index:1;}
#ui{position:fixed;top:10px;left:0;width:100%;text-align:center;color:#ffafcc;font-size:18px;z-index:3;pointer-events:none;}
#score{font-size:24px;font-weight:bold;color:#ff4d6d;}

/* ---- 3️⃣ 表白页 ---- */
#love{display:none;position:fixed;inset:0;z-index:10;justify-content:center;align-items:center;flex-direction:column;padding:20px;text-align:center;background:radial-gradient(circle at 50% 50%, #2d1e3e 0%, #0f0c29 100%);}
#love h1{color:#ff4d6d;font-size:32px;margin-bottom:20px;}
#text{color:#f0f0f0;font-size:19px;line-height:1.9;max-width:340px;}
#finalScore{color:#ffafcc;font-size:20px;margin-top:10px;}
#nextBtn{margin-top:20px;padding:14px 44px;border:none;border-radius:30px;background:#ff4d6d;color:white;font-size:18px;cursor:pointer;display:none;}
</style>
</head>
<body>

<!-- 1️⃣ 开场页 -->
<div id="startScreen">
    <h1>逃离继权的求爱</h1>
    <button id="startBtn">开始逃离 🏃♂️</button>
</div>

<!-- 2️⃣ 游戏页 -->
<div id="gameScreen">
    <div id="gameBg"></div>
    <canvas id="c"></canvas>
    <div id="ui">躲避距离：<span id="score">0</span> 米</div>
</div>

<!-- 3️⃣ 表白页 -->
<div id="love">
  <h1>黄崇皓，我有话对你说</h1>
  <div id="text"></div>
  <div id="finalScore"></div>
  <button id="nextBtn" onclick="location.reload()">再跑一次试试 😠</button>
</div>

<script>
/* ---- 核心：按钮点击跳转 ---- */
document.getElementById('startBtn').onclick = ()=>{
    document.getElementById('startScreen').style.opacity = '0';
    setTimeout(()=>{
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'block';
        initGame(); // 启动游戏
    }, 600);
};

/* ---- 游戏全局变量 ---- */
let W,H,cv,cx;
let P, hearts=[], score=0, hit=0, over=false;

function initGame(){
    cv=document.getElementById('c'); 
    cx=cv.getContext('2d');
    W=cv.width=innerWidth; 
    H=cv.height=innerHeight;
    
    // 玩家初始位置
    P={x:W/2,y:H/2,r:28};
    
    // 👉 手机触屏拖动
    cv.addEventListener('touchmove', e=>{
        e.preventDefault();
        P.x=e.touches[0].clientX;
        P.y=e.touches[0].clientY;
    },{passive:false});

    // 👉 电脑鼠标拖动（新增，电脑可玩）
    cv.addEventListener('mousemove', e=>{
        P.x = e.clientX;
        P.y = e.clientY;
    });

    let frame=0;
    (function loop(){
        if(over) return; // 游戏结束停止渲染
        requestAnimationFrame(loop);
        cx.clearRect(0,0,W,H);
        
        // 边界限制，防止移出屏幕
        P.x=Math.max(P.r, Math.min(W-P.r, P.x));
        P.y=Math.max(P.r+60, Math.min(H-P.r-100, P.y));
        
        // 定时生成爱心
        if(frame%40===0) hearts.push({x:Math.random()*(W-60)+30,y:-30,v:3,r:18});
        
        // 爱心碰撞、移出逻辑
        for(let i=hearts.length-1;i>=0;i--){
            const h=hearts[i]; 
            h.y+=h.v;
            // 碰撞判定
            if(Math.hypot(h.x-P.x,h.y-P.y)<h.r+P.r){ 
                hearts.splice(i,1); 
                hit++; 
                if(hit>=3) endGame(); 
                continue; 
            }
            // 爱心移出屏幕，加分
            if(h.y>H+40){ 
                hearts.splice(i,1); 
                score+=10; 
                document.getElementById('score').textContent=score; 
            }
        }
        
        // 绘制玩家：黄崇皓
        cx.fillStyle='#89c2d9'; 
        cx.beginPath(); 
        cx.arc(P.x,P.y,P.r,0,Math.PI*2); 
        cx.fill();
        cx.fillStyle='#1d3557'; 
        cx.font='bold 14px sans-serif'; 
        cx.textAlign='center'; 
        cx.fillText('黄崇皓',P.x,P.y+45);
        
        // 绘制爱心
        hearts.forEach(h=>{
            cx.save();
            cx.translate(h.x,h.y);
            cx.scale(h.r/24,h.r/24);
            cx.fillStyle='#ff4d6d';
            cx.beginPath(); 
            cx.moveTo(0,-12); 
            cx.bezierCurveTo(-12,-24,-28,-8,-28,8); 
            cx.bezierCurveTo(-28,24,-12,36,0,48); 
            cx.bezierCurveTo(12,36,28,24,28,8); 
            cx.bezierCurveTo(28,-8,12,-24,0,-12); 
            cx.fill(); 
            cx.restore();
        });
        
        frame++;
    })();
}

/* ---- 游戏结束逻辑（补全你截断的函数） ---- */
function endGame(){
    over = true;
    // 隐藏游戏界面，展示结局页
    document.getElementById('gameScreen').style.display = 'none';
    const lovePage = document.getElementById('love');
    lovePage.style.display = 'flex';

    // 结局文案
    const textDom = document.getElementById('text');
    textDom.innerText = "很遗憾，你被爱心追上啦~\n继权的求爱成功咯！";

    // 最终得分
    const finalScoreDom = document.getElementById('finalScore');
    finalScoreDom.innerText = `本次躲避距离：${score} 米`;

    // 显示重新开始按钮
    document.getElementById('nextBtn').style.display = 'block';
}
</script>
</body>
</html>
