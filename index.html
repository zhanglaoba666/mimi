<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>逃离继权的求爱 💒🏃♂️</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;}

/* ---- 开场婚礼页 ---- */
#startScreen{
    position:fixed;inset:0;z-index:100;
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                url('https://images.unsplash.com/photo-1543087903-2d5fd775e75a?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
    display:flex;justify-content:center;align-items:center;flex-direction:column;
    transition:opacity 0.8s;
}
#startScreen h1{
    color:white;
    font-size: clamp(28px, 8vw, 52px);
    text-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff4d6d;
    text-align:center;
    margin-bottom:40px;
    animation: pulse 1.5s infinite;
}
#startBtn{
    padding: 18px 60px;
    font-size: 24px;
    border:none;
    border-radius: 50px;
    background: linear-gradient(45deg, #ff4d6d, #ff8e8e);
    color:white;
    cursor:pointer;
    box-shadow: 0 10px 30px rgba(255,77,109,0.5);
    transition:transform 0.2s;
}
#startBtn:hover{transform:scale(1.05);}

/* ---- 游戏界面 ---- */
#gameScreen{display:none;position:fixed;inset:0;}

/* 🌸 日漫背景图 */
#gameBg{
    position:absolute;
    inset:0;
    background: url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?auto=format&fit=crop&w=1600&q=80') no-repeat center/cover;
    z-index:0;
    filter:brightness(0.85);
}

canvas{display:block;position:absolute;inset:0;z-index:1;}

/* UI */
#ui{position:fixed;top:10px,left:0;width:100%;text-align:center;color:#ffafcc;font-size:18px;z-index:3;pointer-events:none;}
#score{font-size:24px;font-weight:bold;color:#ff4d6d;text-shadow:0 0 10px #ff4d6d88;}

/* 表白页 */
#love{display:none;position:fixed;inset:0;z-index:10;justify-content:center;align-items:center;flex-direction:column;padding:20px;text-align:center;background:radial-gradient(circle at 50% 50%, #2d1e3e 0%, #0f0c29 100%);}
#love h1{color:#ff4d6d;font-size:32px;margin-bottom:20px;animation:pulse 2s infinite;}
#text{color:#f0f0f0;font-size:19px,line-height:1.9;max-width:340px,min-height:150px;}
#finalScore{color:#ffafcc;font-size:20px;margin-top:10px;}
#nextBtn{margin-top:20px;padding:14px 44px;border:none;border-radius:30px,background:#ff4d6d,color:white,font-size:18px,cursor:pointer,display:none,box-shadow:0 0 20px #ff4d6d88;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
</style>
</head>
<body>

<!-- 开场婚礼页 -->
<div id="startScreen">
    <h1>逃离继权的求爱</h1>
    <button id="startBtn">开始逃离 🏃♂️</button>
</div>

<!-- 游戏页 -->
<div id="gameScreen">
    <!-- 日漫背景层 -->
    <div id="gameBg"></div>
    <!-- 画布层（用来画角色、爱心、特效） -->
    <canvas id="c"></canvas>
    <div id="ui">躲避距离：<span id="score">0</span> 米</div>
</div>

<!-- 表白页 -->
<div id="love">
  <h1>黄崇皓，我有话对你说</h1>
  <div id="text"></div>
  <div id="finalScore"></div>
  <button id="nextBtn" onclick="location.reload()">再跑一次试试 😠</button>
</div>

document.getElementById('startBtn').onclick = ()=>{
    document.getElementById('startScreen').style.opacity=0;

        document.getElementById('startScreen').style.display='none';
        document.getElementById('gameScreen').style.display='block';

    },800);
