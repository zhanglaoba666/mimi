<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逃离继权的求爱 💒🏃♂️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;overflow:hidden;background:#1a1a1a;}

#start{
  position:fixed;
  width:100vw;
  height:100vh;
  background:linear-gradient(135deg, #ff758f, #ff4d6d);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  z-index:10;
}
#start h1{
  font-size:32px;
  margin-bottom:30px;
  text-shadow:0 0 10px rgba(0,0,0,0.3);
}
#startBtn{
  padding:16px 40px;
  font-size:20px;
  border:none;
  border-radius:50px;
  background:white;
  color:#ff4d6d;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
#startBtn:active{transform:scale(0.95);}

#game{
  display:none;
  position:fixed;
  width:100vw;
  height:100vh;
  background:linear-gradient(#fadadd, #e8c8e8, #d4b4e8);
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
}
#score{
  position:fixed;
  top:15px;
  left:0;
  width:100%;
  text-align:center;
  font-size:22px;
  color:#ff4d6d;
  font-weight:bold;
  z-index:5;
}

#over{
  display:none;
  position:fixed;
  width:100vw;
  height:100vh;
  background:#1a1a1a;
  color:white;
  text-align:center;
  padding:20px;
  z-index:20;
}
#over h1{
  margin-top:30vh;
  color:#ff4d6d;
  font-size:28px;
}
#overText{
  margin:20px 0;
  font-size:18px;
  line-height:1.6;
}
#restart{
  padding:14px 30px;
  background:#ff4d6d;
  color:white;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>
<div id="start">
  <h1>逃离继权的求爱</h1>
  <button id="startBtn">开始逃离 🏃♂️</button>
</div>

<div id="game">
  <div id="score">躲避距离：0 米</div>
  <canvas id="canvas"></canvas>
</div>

<div id="over">
  <h1>黄崇皓，我有话对你说</h1>
  <div id="overText"></div>
  <button id="restart">再跑一次试试 😠</button>
</div>

<script>
let start = document.getElementById('start');
let game = document.getElementById('game');
let over = document.getElementById('over');
let startBtn = document.getElementById('startBtn');
let restartBtn = document.getElementById('restart');
let scoreText = document.getElementById('score');
let overText = document.getElementById('overText');

let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player = {
  x: canvas.width/2,
  y: canvas.height/2,
  r: 28
};
let hearts = [];
let score = 0;
let hit = 0;
let gameOver = false;

startBtn.onclick = function(){
  start.style.display = 'none';
  game.style.display = 'block';
  startGame();
};
restartBtn.onclick = () => location.reload();

function startGame(){
  window.addEventListener('mousemove', (e)=>{
    player.x = e.clientX;
    player.y = e.clientY;
  });
  window.addEventListener('touchmove', (e)=>{
    e.preventDefault();
    player.x = e.touches[0].clientX;
    player.y = e.touches[0].clientY;
  }, {passive:false});

  let frame = 0;
  function loop(){
    if(gameOver) return;
    requestAnimationFrame(loop);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
    player.y = Math.max(player.r + 50, Math.min(canvas.height - player.r - 50, player.y));

    if(frame % 35 === 0){
      hearts.push({
        x: Math.random()*(canvas.width-60)+30,
        y: -20,
        r: 16,
        v: 3.5
      });
    }

    for(let i=hearts.length-1; i>=0; i--){
      let h = hearts[i];
      h.y += h.v;

      let dx = h.x - player.x;
      let dy = h.y - player.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < h.r + player.r){
        hearts.splice(i,1);
        hit++;
        if(hit >= 3){
          endGame();
        }
        continue;
      }

      if(h.y > canvas.height + 50){
        hearts.splice(i,1);
        score += 10;
        scoreText.innerText = `躲避距离：${score} 米`;
      }

      drawHeart(h.x, h.y, h.r);
    }

    ctx.fillStyle = '#89c2d9';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#1d3557';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('黄崇皓', player.x, player.y + 40);

    frame++;
  }
  loop();
}

function drawHeart(x,y,s){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s/20, s/20);
  ctx.fillStyle = '#ff4d6d';
  ctx.beginPath();
  ctx.moveTo(0,-10);
  ctx.bezierCurveTo(-10,-20,-25,-5,-25,10);
  ctx.bezierCurveTo(-25,25,-10,40,0,50);
  ctx.bezierCurveTo(10,40,25,25,25,10);
  ctx.bezierCurveTo(25,-5,10,-20,0,-10);
  ctx.fill();
  ctx.restore();
}

function endGame(){
  gameOver = true;
  game.style.display = 'none';
  over.style.display = 'block';
  overText.innerText = `很遗憾，你被爱心追上啦～\n继权的求爱成功咯！\n本次躲避距离：${score} 米`;
}
</script>
</body>
</html>
